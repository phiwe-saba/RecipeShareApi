<div class="container mt-4" *ngIf="!isLoading && recipe; else loading">
  <div class="card shadow-lg p-4">
    <h2 class="mb-3 text-center text-success">Edit Recipe</h2>

    <form (ngSubmit)="saveRecipe()">
      <div class="mb-3">
        <label>Title</label>
        <input type="text" class="form-control" [(ngModel)]="recipe.title" name="title" required />
      </div>

      <div class="mb-3">
        <label>Cooking Time (minutes)</label>
        <input type="number" class="form-control" [(ngModel)]="recipe.cookingTime" name="cookingTime" required />
      </div>

      <div class="mb-3">
        <label>Dietary Tag</label>
        <input type="text" class="form-control" [(ngModel)]="recipe.dietaryTag" name="dietaryTag" />
      </div>

      <div class="mb-3">
        <label>Ingredients</label>
        <ul>
          <li *ngFor="let ingredient of recipe.ingredients; let i = index">
            {{ ingredient }}
            <button type="button" class="btn btn-sm btn-danger ms-2" (click)="removeIngredient(i)">x</button>
          </li>
        </ul>
        <div class="input-group mt-2">
          <input type="text" class="form-control" placeholder="Add ingredient" [(ngModel)]="newIngredient" name="newIngredient" />
          <button type="button" class="btn btn-success" (click)="addIngredient()">Add</button>
        </div>
      </div>

      <div class="mb-3">
        <label>Steps</label>
        <ol>
          <li *ngFor="let step of recipe.steps; let i = index">
            {{ step }}
            <button type="button" class="btn btn-sm btn-danger ms-2" (click)="removeStep(i)">x</button>
          </li>
        </ol>
        <div class="input-group mt-2">
          <input type="text" class="form-control" placeholder="Add step" [(ngModel)]="newStep" name="newStep" />
          <button type="button" class="btn btn-success" (click)="addStep()">Add</button>
        </div>
      </div>

      <div class="text-center mt-4">
        <button type="submit" class="btn btn-primary me-2">
          <i class="fa fa-save"></i> Save Changes
        </button>
        <button type="button" class="btn btn-secondary" (click)="cancel()">
          <i class="fa fa-arrow-left"></i> Cancel
        </button>
      </div>
    </form>
  </div>
</div>

<ng-template #loading>
  <div class="text-center mt-5">
    <div class="spinner-border text-success" role="status"></div>
    <p class="mt-3">Loading recipe details...</p>
  </div>
</ng-template>
