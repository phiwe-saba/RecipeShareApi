<div class="container-xl">
  <div class="table-responsive">
    <div class="table-wrapper">
      <div class="table-title">
        <div class="row">
          <div class="col-sm-6">
            <h4><b>Manage Recipe</b></h4>
          </div>
          <div class="col-sm-6">
            <button class="btn btn-success" (click)="AddRecipe()">
              <i class='fas fa-plus-circle'></i><span> ADD</span>
            </button>
          </div>
        </div>
      </div>
      <table class="table table-striped table-hover table-bordered table-content">
        <thead>
          <tr class="center-align">
            <th>Title</th>
            <th>Ingredients</th>
            <th>Steps</th>
            <th>Cooking Time</th>
            <th>Dietary Tag</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let recipe of recipeList" class="center-align">
            <td>{{ recipe.Title }}</td>
            <td>{{ recipe.Ingredients }}</td>
            <td>{{ recipe.Steps }}</td>
            <td>{{ recipe.CookingTime }}</td>
            <td>{{ recipe.DietaryTag }}</td>
            <td>
              <a href="#" [routerLink]="['/ViewRecipe/', recipe.id]" class="btn"><i class='fas fa-eye view'></i></a>
              <a href="#" [routerLink]="['/EditRecipe/', recipe.id]" class="btn"><i class="fa fa-edit edit"></i></a>
              <button type="button" (click)="deleteRecipeConfirmation(recipe)" class="btn"><i class='fas fa-trash-alt delete'></i></button>
            </td>
          </tr>
          <tr>
            <td *ngIf="recipeList.length == 0" colspan="6">No Recipe Found</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
