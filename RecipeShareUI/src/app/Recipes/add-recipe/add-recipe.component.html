<form [formGroup]="recipeForm" (ngSubmit)="onSubmit()">
  <div class="form-group">
    <label>Title</label>
    <input
      type="text"
      class="form-control"
      formControlName="title"
      placeholder="Enter recipe title"
    />
    <div *ngIf="recipeForm.get('title')?.invalid && isSubmitted" class="text-danger">
      Title is required and cannot exceed 100 characters.
    </div>
  </div>

  <div formArrayName="ingredients">
    <label>Ingredients</label>
    <div *ngFor="let ingredient of ingredients.controls; let i = index">
      <input type="text" [formControlName]="i" class="form-control mb-2" />
      <button type="button" class="btn btn-danger btn-sm" (click)="removeIngredient(i)">Remove</button>
    </div>
    <button type="button" class="btn btn-secondary mt-2" (click)="addIngredient()">+ Add Ingredient</button>
  </div>

  <div formArrayName="steps">
    <label>Steps</label>
    <div *ngFor="let step of steps.controls; let i = index">
      <textarea [formControlName]="i" class="form-control mb-2"></textarea>
      <button type="button" class="btn btn-danger btn-sm" (click)="removeStep(i)">Remove</button>
    </div>
    <button type="button" class="btn btn-secondary mt-2" (click)="addStep()">+ Add Step</button>
  </div>

  <div class="form-group">
    <label>Cooking Time (minutes)</label>
    <input type="number" class="form-control" formControlName="cookingTime" />
  </div>

  <div class="form-group">
    <label>Dietary Tag</label>
    <input type="text" class="form-control" formControlName="dietaryTag" />
  </div>

  <button type="submit" class="btn btn-success mt-3">Submit</button>
</form>
